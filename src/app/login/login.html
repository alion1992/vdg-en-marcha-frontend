<div class="login-page">

  <!-- CABECERA -->
  <header class="login-header">
    <div class="logo-container">
      <img src="../assets/img/logoTipoI.png"
           alt="VdG-En Marcha"
           class="logo">
    </div>

    <div class="welcome-text">
      <h1>VdG-<span>En Marcha</span></h1>
      <p>Registro de movilidad sostenible</p>
    </div>
  </header>

  <!-- LOGIN -->
  <main class="login-content">

    <div class="login-card">

      <h2>Iniciar sesión</h2>
      <p class="subtitle">
        Accede para registrar tus entradas y salidas
      </p>

      <form>

        <!-- EMAIL -->
        <div class="input-group">
          <label for="document">Usuario</label>

          <div class="input-container">
            <i class="fa-solid fa-id-card"></i>

            <input
              name="usuario"
              id="document"
              placeholder="" [(ngModel)]="usuario">
          </div>
        </div>

        <!-- PASSWORD -->
<div class="input-group">
  <label for="password">Contraseña</label>

  <div class="input-container">
    <i class="fa-solid fa-lock"></i>

    <input
      name="password"
      [type]="mostrarPassword ? 'text' : 'password'"
      id="password"
      placeholder="********"
      [(ngModel)]="password">

    <i
      class="fa-solid"
      [ngClass]="mostrarPassword ? 'fa-eye-slash' : 'fa-eye'"
      (click)="mostrarPassword = !mostrarPassword"
      style="cursor: pointer;">
    </i>

  </div>
</div>

        <!-- RECORDAR -->
        <div class="options">
          <label class="remember">
            <input type="checkbox">
            Recordarme
          </label>

          
        </div>

        <!-- BOTON -->
        <button
            type="button"
            class="login-button"
            (click)="login()">
            Entrar
            </button>
            <div class="register-link">
            ¿No tienes cuenta?
            <a routerLink="/registro">Regístrate</a>
            </div>

      </form>

    </div>

  </main>

</div>
