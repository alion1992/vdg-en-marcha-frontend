<div class="dashboard">

  <header class="dashboard-header">

    <div class="header-left">

      <img
        src="assets/img/logoTipoI.png"
        alt="logo"
        class="logo">

      <div>
        <h1>VdG-En Marcha</h1>
        <p>Movilidad sostenible 🚲</p>
      </div>

    </div>

   <div
  class="header-actions"
  (click)="cerrarSesion()">

  <i class="fa-solid fa-right-from-bracket"></i>

</div>

  </header>

  <div class="dashboard-grid">

    <!-- ABRIR PUERTA -->
    <div
      class="dashboard-tile"
      (click)="abrirPuerta()">

      <i class="fa-solid fa-lock-open"></i>

      <h3>Abrir puerta</h3>

      <p>Acceso al aparcamiento</p>

    </div>

    <!-- ENTRADA / SALIDA -->
    <div
      class="dashboard-tile"
      routerLink="/entrada">

      <i class="fa-solid fa-bicycle"></i>

      <h3>Entrada / Salida</h3>

      <p>Registrar trayecto</p>

    </div>

    <!-- HISTORIAL -->
    <div
      class="dashboard-tile"
      routerLink="/historial">

      <i class="fa-solid fa-clock-rotate-left"></i>

      <h3>Historial rutas</h3>

      <p>Consultar registros</p>

    </div>

   <div
  class="dashboard-tile"
  routerLink="/mapa">

  <i class="fa-solid fa-map-location-dot"></i>

  <h3>Mapa</h3>

  <p>Zonas de aparcamiento</p>

</div>

  </div>



<footer class="dashboard-footer">

  <div class="footer-item">
    <i class="fa-solid fa-location-dot"></i>
    Paseo de San Gregorio, 82-84 · 13500 Puertollano
  </div>

  <div class="footer-item">
    <i class="fa-solid fa-phone"></i>
    926 42 62 50
  </div>

  <div class="footer-item">
    <i class="fa-solid fa-globe"></i>
    CIFP Virgen de Gracia
  </div>

</footer>
</div>
