<div class="historial-page">

  <header class="page-header">

    <button
      class="back-button"
      (click)="volver()">

      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <h1>Historial</h1>

  </header>

  <div
  class="trip-card"
  *ngFor="let registro of registros">

  <div class="trip-header">

    <h3>
      {{ registro.fechaHoraEntrada | date:'dd/MM/yyyy' }}
    </h3>

    <span class="km-badge">

      {{ registro.kilometros }} km

    </span>

  </div>

  <div class="trip-times">

    <div>

      <span>Entrada</span>

      <strong>

        {{ registro.fechaHoraEntrada | date:'HH:mm' }}

      </strong>

    </div>

    <div>

      <span>Salida</span>

      <strong>

        {{ registro.fechaHoraSalida | date:'HH:mm' }}

      </strong>

    </div>

  </div>

</div>
  </div>
