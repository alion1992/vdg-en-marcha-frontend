<div class="register-page">

  <header class="register-header">
   
    <img
      src="assets/img/logoTipo2.png"
      alt="logo"
      class="logo">

    <h1>Crear cuenta</h1>

    <p>VdG-En Marcha</p>

  </header>

  <form
  class="register-card"
  #registroForm="ngForm"
  (ngSubmit)="registrar(registroForm)">

    <div class="input-group">

      <label>DNI</label>

    <div class="input-container"> <i class="fa-solid fa-id-card"></i> <input type="text" placeholder="00000000X"
            [(ngModel)]="dni" required name="dni">  </div>

    </div>

    <div class="input-group">

      <label>Nombre</label>

      <div class="input-container"> <i class="fa-solid fa-user"></i> <input type="text" placeholder="Nombre" [(ngModel)]="nombre" required name="nombre"> </div>

    </div>

    <div class="input-group">

      <label>Apellidos</label>

      <div class="input-container"> <i class="fa-solid fa-user"></i> <input type="text" placeholder="Apellidos" [(ngModel)]="apellidos" required name="apellidos"> </div>

    </div>

    <div class="input-group">

      <label>Email</label>

      <div class="input-container"> <i class="fa-solid fa-envelope"></i> <input type="email" placeholder="correo@ejemplo.com" [(ngModel)]="email" required name="email"> </div>

    </div>



    <div class="input-group">

      <label>Contraseña</label>

      <div class="input-container">
        <i class="fa-solid fa-lock"></i>
        <input
        type="password"
        [(ngModel)]="password" required name="password">
      </div>

    </div>

    
<button
    class="register-button"
    (click)="registrar(registroForm)"
    type="button">
    Crear cuenta
  </button>

  </form>

</div>
