<div class="dashboard">

  <header class="dashboard-header">

    <div class="header-left">

      <img
        src="assets/img/logoTipoI.png"
        alt="logo"
        class="logo">

      <div>
        <h1>VdG-En Marcha</h1>
        <p>Hola Francisco 👋</p>
      </div>

    </div>

    <div class="header-actions">
      <i class="fa-solid fa-user"></i>
    </div>

  </header>

  <div class="dashboard-grid">

    <!-- ABRIR PUERTA -->
    <div
      class="dashboard-tile"
      (click)="abrirPuerta()">

      <i class="fa-solid fa-lock-open"></i>

      <h3>Abrir puerta</h3>

      <p>Acceso al aparcamiento</p>

    </div>

    <!-- ENTRADA / SALIDA -->
    <div
      class="dashboard-tile"
      routerLink="/entrada">

      <i class="fa-solid fa-bicycle"></i>

      <h3>Entrada / Salida</h3>

      <p>Registrar trayecto</p>

    </div>

    <!-- HISTORIAL -->
    <div
      class="dashboard-tile"
      routerLink="/historial">

      <i class="fa-solid fa-clock-rotate-left"></i>

      <h3>Historial rutas</h3>

      <p>Consultar registros</p>

    </div>

    <!-- PERFIL -->
    <div
      class="dashboard-tile"
      routerLink="/perfil">

      <i class="fa-solid fa-user-pen"></i>

      <h3>Modificar datos</h3>

      <p>Editar perfil</p>

    </div>

  </div>

</div>
